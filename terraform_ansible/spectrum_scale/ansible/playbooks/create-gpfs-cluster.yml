---
- name: Configure IBM Storage Scale (GPFS) cluster
  hosts: scale-node-1
  become: true

  vars:
    gpfs_bin: /usr/lpp/mmfs/bin

    scale_nodes:
      - "scale-node-1:quorum-manager"
      - "scale-node-2:quorum"
      - "scale-node-3:quorum"

  tasks:

    - name: Create scale_nodes.txt
      ansible.builtin.copy:
        dest: /root/scale_nodes.txt
        content: |
          {% for node in scale_nodes %}
          {{ node }}
          {% endfor %}
        owner: root
        group: root
        mode: '0644'

    - name: Create GPFS cluster
      ansible.builtin.command:
        cmd: >
          {{ gpfs_bin }}/mmcrcluster
          -N /root/scale_nodes.txt
          -p scale-node-1
          -s scale-node-2
      register: mmcrcluster_result
      changed_when: "'GPFS cluster created successfully' in mmcrcluster_result.stdout"
      failed_when:
        - mmcrcluster_result.rc != 0
        - "'already exists' not in mmcrcluster_result.stderr | lower"

    - name: Show cluster creation output
      ansible.builtin.debug:
        var: mmcrcluster_result.stdout_lines

    - name: Accept GPFS license
      ansible.builtin.command:
        cmd: >
          {{ gpfs_bin }}/mmchlicense server --accept -N all
      register: mmlicense_result
      changed_when: mmlicense_result.rc == 0

    - name: Start GPFS on all nodes
      ansible.builtin.command:
        cmd: >
          {{ gpfs_bin }}/mmstartup -a
      register: mmstartup_result
      changed_when: mmstartup_result.rc == 0

    - name: Verify GPFS state
      ansible.builtin.command:
        cmd: >
          {{ gpfs_bin }}/mmgetstate -a
      register: mmgetstate_result
      changed_when: false

    - name: Display GPFS state
      ansible.builtin.debug:
        var: mmgetstate_result.stdout_lines

    - name: Fail if any node is not active
      ansible.builtin.fail:
        msg: "One or more GPFS nodes are not active"
      when: "'active' not in mmgetstate_result.stdout"

    - name: Verify cluster configuration
      ansible.builtin.command:
        cmd: >
          {{ gpfs_bin }}/mmlscluster
      register: mmlscluster_result
      changed_when: false

    - name: Display cluster information
      ansible.builtin.debug:
        var: mmlscluster_result.stdout_lines