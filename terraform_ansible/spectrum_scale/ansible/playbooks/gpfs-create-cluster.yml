---
- name: Configure IBM Storage Scale (GPFS) cluster
  hosts: scale-node-1
  become: true

  vars:
    gpfs_bin: /usr/lpp/mmfs/bin
    nodefile_path: /root/scale_nodes.txt

    scale_nodes:
      - "scale-node-1:quorum-manager"
      - "scale-node-2:quorum"
      - "scale-node-3:quorum"
  
#  vars:
#    cluster_name: scale_cluster
#    primary_node: scale-node-1
#    secondary_node: scale-node-2
#    nodefile_path: /root/scale_nodes.txt

  tasks:

    - name: Create scale_nodes.txt
      ansible.builtin.copy:
        dest: "{{ nodefile_path }}"
        content: |
          {% for node in scale_nodes %}
          {{ node }}
          {% endfor %}
        owner: root
        group: root
        mode: '0644'
    
    - name: Display node list file
      ansible.builtin.command: cat {{ nodefile_path }}
      register: nodefile_output
      changed_when: false

    - name: Show node file content
      ansible.builtin.debug:
        var: nodefile_output.stdout_lines

    - name: Create GPFS cluster
      ansible.builtin.command:
        cmd: >
          {{ gpfs_bin }}/mmcrcluster
          -N /root/scale_nodes.txt
          -p scale-node-1
          -s scale-node-2
      register: mmcrcluster_result
      changed_when: "'GPFS cluster created successfully' in mmcrcluster_result.stdout"
      failed_when:
        - mmcrcluster_result.rc != 0
        - "'already exists' not in mmcrcluster_result.stderr | lower"

    - name: Show cluster creation output
      ansible.builtin.debug:
        var: mmcrcluster_result.stdout_lines

    

    