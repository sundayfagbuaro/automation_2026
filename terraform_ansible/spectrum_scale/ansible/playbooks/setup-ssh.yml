---
- hosts: scale
  become: true
  tasks:
#    - name: Install SSH public key for bobosunne user
#      authorized_key:
#        user: bobosunne
#        state: present
#        key: "{{ lookup('file', '/home/bobosunne/.ssh/id_ed25519.pub') }}"

    - name: Generate SSH keys
      openssh_keypair:
        path: /home/bobosunne/.ssh/id_rsa
        type: rsa
        size: 4096
        owner: bobosunne
        group: bobosunne
    
    - name: Read public key
      slurp:
        src: /home/rocky/.ssh/id_rsa.pub
      register: pubkey
    
    - name: Add keys to authorized_keys
      authorized_key:
        user: bobosunne
        state: present
        key: "{{ hostvars[item]['pubkey']['content'] | b64decode }}"
      loop: "{{ groups['scale'] }}"